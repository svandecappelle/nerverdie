@if (isLoggedIn()) {
  <mat-toolbar class="toolbar">
    <a class="brand" routerLink="/" aria-label="Neverdie home">
      <span class="logo" aria-hidden="true"><mat-icon>monitor_heart</mat-icon></span>
      <span class="name">Neverdie</span>
    </a>

    <nav aria-label="Main">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>space_dashboard</mat-icon>
        <span class="label">Dashboard</span>
      </a>
      <a class="nav-link" routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">
        <mat-icon>tune</mat-icon>
        <span class="label">Administration</span>
      </a>
    </nav>

    <span class="spacer"></span>

    <app-theme-toggle />
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #menu="matMenu" xPosition="before">
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar>
}
