@if (isLoggedIn()) {
  <mat-toolbar class="mat-elevation-z6 toolbar">
    <span>Neverdie</span>
    <span class="sub-title">monitor servers</span>

    <nav>
      <a mat-icon-button routerLink="/" aria-label="Home">
        <mat-icon>dashboard</mat-icon>
      </a>
      <a mat-icon-button routerLink="/all_nodes" aria-label="All nodes">
        <mat-icon>view_module</mat-icon>
      </a>
      <a mat-icon-button routerLink="/admin" aria-label="Admin panel">
        <mat-icon>settings</mat-icon>
      </a>
    </nav>

    <span class="spacer"></span>

    <mat-form-field class="search" subscriptSizing="dynamic">
      <input matInput aria-label="Search" #searchInput (change)="search(searchInput.value)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Logout</span>
      </button>
      <a mat-menu-item routerLink="/profile">
        <mat-icon>account_circle</mat-icon>
        <span>Edit profile</span>
      </a>
    </mat-menu>
  </mat-toolbar>
}
