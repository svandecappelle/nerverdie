<div class="content">
  <h2 class="mat-headline-small">Current server status</h2>

  <mat-grid-list cols="6" rowHeight="100px">
    @for (tile of tiles(); track tile.text) {
      <mat-grid-tile [colspan]="tile.cols" [rowspan]="tile.rows" [style.background]="tile.color">
        <app-indicator [tile]="tile" />
      </mat-grid-tile>
    }
  </mat-grid-list>

  <h2 class="mat-headline-small">Current server loads</h2>
  @if (cpu(); as cpu) {
    <app-chart [series]="cpu.series" title="CPU" [onPull]="cpu.onPull" endPoint="cpu" />
  }
  <app-chart [series]="memory.series" title="Memory" [onPull]="memory.onPull" endPoint="memory" />
  <app-chart
    [series]="network.series"
    title="Network"
    [onPull]="network.onPull"
    endPoint="network"
    width="100%"
  />
</div>
