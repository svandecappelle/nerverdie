<div class="signin">
  <app-theme-toggle class="theme" />

  <mat-card class="card" appearance="outlined">
    @if (loginInProgress()) {
      <mat-progress-bar class="progress" mode="indeterminate" />
    }
    <mat-card-content>
      <div class="brand">
        <span class="logo" aria-hidden="true"><mat-icon>monitor_heart</mat-icon></span>
        <h1>Neverdie</h1>
        <p>Please login to continue</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>User</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="userName" autocomplete="username" required />
          <mat-error>Please inform your user name</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            required
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Please inform your password</mat-error>
        </mat-form-field>

        @if (loginError(); as error) {
          <p class="login-error" role="alert">{{ error }}</p>
        }

        <button mat-flat-button class="submit" type="submit" [disabled]="loginInProgress()">Login</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
