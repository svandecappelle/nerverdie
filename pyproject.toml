[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neverdie"
version = "1.0.0"
description = "Python server monitoring"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "flask>=3.1",
    "werkzeug>=3.1",
    "jinja2>=3.1.6",
    "peewee>=3.17",
    "psutil>=7.0",
    "py-cpuinfo>=9.0",
    "schedule>=1.2",
    "scapy>=2.6",
    "netaddr>=1.3",
    # Configuration file (etc/neverdie.yml).
    "pyyaml>=6.0.2",
    # Production WSGI server (works on Windows and Linux).
    "waitress>=3.0.1",
    # curses is not shipped with Python on Windows (console.py).
    "windows-curses>=2.4; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "pip-audit>=2.9",
]

[tool.uv]
# Application, not a library: install dependencies only.
package = false

[tool.setuptools.packages.find]
# `pip install .` packages the server only (client/ and etc/ are not Python packages).
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["client", "test/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",  # long lines in legacy code
    "S101",  # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S104", "S105", "S106"]  # 0.0.0.0 as a configuration value, test passwords
"scripts/**" = ["S603", "S606", "S607"]  # launchers: fixed commands (uv, npm, pip, the app), no shell
