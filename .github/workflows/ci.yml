name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run so that newly published CVEs are caught by pip-audit
    # even when nobody pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-audit:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (lockfile must be up to date)
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Known vulnerabilities (pip-audit)
        run: uv run pip-audit --progress-spinner off

      # Strict run on the reference Python: any deprecated API in use fails
      # the build (the test matrix below only reports warnings).
      - name: Pytest, deprecation warnings as errors
        run: uv run pytest -W error::DeprecationWarning

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  pip-install:
    name: pip install, without uv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The project builds as a package (pip install . must work).
      - name: Build the package
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Create .venv with pip (scripts/bootstrap.py)
        run: python scripts/bootstrap.py --dev

      - name: Pytest from .venv
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=.venv/Scripts/python.exe; fi
          "$py" -m pytest

  install:
    name: make install (nginx, HTTPS, systemd)
    runs-on: ubuntu-latest
    env:
      NEVERDIE_SERVER_NAME: monitor.test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Installs nginx when missing, builds the UI, creates the self-signed
      # certificate, the nginx site and the systemd service, then checks the site.
      - name: make install
        run: make install

      - name: The site answers over HTTPS
        run: |
          set -x
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 301
          # The certificate is valid for the server name.
          curl -sSf --cacert /etc/neverdie/tls/neverdie.crt --resolve monitor.test:443:127.0.0.1 \
            https://monitor.test/ | grep -q '<app-root'
          curl -sSkI https://127.0.0.1/ | grep -qi '^content-security-policy:'
          curl -sSkI https://127.0.0.1/ | grep -qi '^strict-transport-security:'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/api/auth)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/dashboard)" = 200
          systemctl is-active neverdie

      - name: make install again (update) keeps the certificate
        run: |
          before=$(sha256sum /etc/neverdie/tls/neverdie.crt)
          make install
          test "$before" = "$(sha256sum /etc/neverdie/tls/neverdie.crt)"

      - name: make uninstall
        run: |
          make uninstall
          ! systemctl is-active neverdie
          test ! -e /var/www/neverdie
          test ! -e /etc/systemd/system/neverdie.service

      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u neverdie -n 100 --no-pager || true
          sudo journalctl -u nginx -n 50 --no-pager || true
          sudo nginx -T || true

  client:
    name: Client (audit, lint, tests, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Known vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Licences (no paid or proprietary dependency)
        run: npm run licenses

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The e2e tests mock the API and enforce the server's exact CSP.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
