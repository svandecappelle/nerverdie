name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run so that newly published CVEs are caught by pip-audit
    # even when nobody pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-audit:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (lockfile must be up to date)
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Known vulnerabilities (pip-audit)
        run: uv run pip-audit --progress-spinner off

      # Strict run on the reference Python: any deprecated API in use fails
      # the build (the test matrix below only reports warnings).
      - name: Pytest, deprecation warnings as errors
        run: uv run pytest -W error::DeprecationWarning

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  pip-install:
    name: pip install, without uv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The project builds as a package (pip install . must work).
      - name: Build the package
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Create .venv with pip (scripts/bootstrap.py)
        run: python scripts/bootstrap.py --dev

      - name: Pytest from .venv
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=.venv/Scripts/python.exe; fi
          "$py" -m pytest

  client:
    name: Client (audit, lint, tests, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Known vulnerabilities (npm audit)
        run: npm audit --audit-level=high

      - name: Licences (no paid or proprietary dependency)
        run: npm run licenses

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The e2e tests mock the API and enforce the server's exact CSP.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
