name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run so that newly published CVEs are caught by pip-audit
    # even when nobody pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-audit:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (lockfile must be up to date)
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Known vulnerabilities (pip-audit)
        run: uv run pip-audit --progress-spinner off

      # Strict run on the reference Python: any deprecated API in use fails
      # the build (the test matrix below only reports warnings).
      - name: Pytest, deprecation warnings as errors
        run: uv run pytest -W error::DeprecationWarning

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest
