version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Angular client (client/package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    groups:
      # Angular packages must move together.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Angular major versions need `ng update` migrations, not a version bump.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # Versions of the actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
